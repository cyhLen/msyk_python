name: Build EXE & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller requests colorama

    - name: Build EXE with PyInstaller
      run: pyinstaller --onefile --noconsole --name msyk msyk_python_v2.2_20250901.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: msyk-windows-exe
        path: dist/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*.exe
        name: msyk ${{ github.ref_name }}
        generate_release_notes: true
